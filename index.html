var STANDALONE = !(window.claude && typeof window.claude.use === "function");
var LS_KEY = "tp-escala-local";
var ui = { tab:"escala", filtro:"", editing:false, canEdit:STANDALONE, readOnlyMsg:"", dia:null, saving:false, local:null, dl:STANDALONE };
if (STANDALONE){ try { var sv = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (sv && sv.estado && sv.base === (state.atualizado || null)){ state = sv.estado; ui.local = sv.salvoEm; } } catch(e){} }
var BASELINE = JSON.stringify(state);

try { var t2 = localStorage.getItem("tp-filtro"); if (t2 !== null) ui.filtro = t2; } catch(e){}
if (/^#(escala|dia|equipe|config)$/.test(location.hash)) ui.tab = location.hash.slice(1);

/* ---------- datas (dias desde a época, UTC) ---------- */
function toN(iso){ var p = iso.split("-"); return Math.round(Date.UTC(+p[0], +p[1]-1, +p[2]) / 864e5); }
function toISO(n){ var d = new Date(n*864e5); return d.toISOString().slice(0,10); }
function wd(n){ var g = new Date(n*864e5).getUTCDay(); return g === 0 ? 7 : g; } /* seg=1 … dom=7 */
function ddmm(n){ var d = new Date(n*864e5); return pad(d.getUTCDate()) + "/" + pad(d.getUTCMonth()+1); }
function ddmmyyyy(n){ return ddmm(n) + "/" + new Date(n*864e5).getUTCFullYear(); }
function pad(x){ return (x < 10 ? "0" : "") + x; }
function edate(iso, m){ var p = iso.split("-"); var y = +p[0], mo = +p[1]-1+m, d = +p[2];
  y += Math.floor(mo/12); mo = ((mo%12)+12)%12;
  var last = new Date(Date.UTC(y, mo+1, 0)).getUTCDate();
  return Math.round(Date.UTC(y, mo, Math.min(d,last)) / 864e5); }
function mod(a,b){ return ((a%b)+b)%b; }
function hm(t){ var p = String(t||"0:0").split(":"); return (+p[0]) + (+p[1]||0)/60; }
function fmtH(h){ var tot = Math.round(h*60); var hh = Math.floor(tot/60), mm = tot%60; return hh + "h" + (mm ? pad(mm) : ""); }
function hoje(){ try { return new Date().toLocaleDateString("en-CA",{timeZone:"America/Sao_Paulo"}); } catch(e){ return new Date().toISOString().slice(0,10); } }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---------- motor da escala (mesmas regras da planilha) ---------- */
function compute(inicioISO){
  var inicio = inicioISO || state.inicio;
  var start = toN(inicio), end = edate(inicio, 1) - 1;
  var b5 = start - mod(wd(start) - 2, 7);                 /* terça que abre a 1ª semana */
  var offset = Math.round((b5 - toN(state.ref)) / 7);     /* mantém o rodízio contínuo */
  var horasTurno = Math.round((hm(state.turno.saida) - hm(state.turno.entrada) - (+state.turno.intervalo||0)) * 100) / 100;
  var fer = {}; state.feriados.forEach(function(f){ if (f.data) fer[f.data] = f.nome; });
  var days = [], nW = 0;
  for (var n = start; n <= end; n++){
    var w = Math.floor((n - b5)/7) + 1; nW = Math.max(nW, w);
    days.push({ n:n, iso:toISO(n), wd:wd(n), dn:DIAS[wd(n)], week:w, fer:fer[toISO(n)] || "" });
  }
  var weeks = []; for (var i = 1; i <= nW; i++){ var ws = b5 + 7*(i-1); weeks.push({ i:i, startN:ws, iso:toISO(ws), label:ddmm(ws)+"–"+ddmm(ws+6) }); }
  var team = state.equipe.filter(function(p){ return (p.nome||"").trim() !== ""; });
  function autoFolga(idx, w){ return ROT[mod(idx + offset + (w-1), 4)]; }
  var rows = team.map(function(p, idx){
    var folgaW = weeks.map(function(wk){ var a = autoFolga(idx, wk.i); var o = p.folgas && p.folgas[wk.iso]; return { auto:a, val:o || a, ov:!!o }; });
    var cells = days.map(function(d){
      var auto = d.wd === 1 ? "F" : (folgaW[d.week-1].val === d.dn ? "F" : "T");
      var key = p.id + "|" + d.iso, o = state.trocas[key];
      return { v: o || auto, auto:auto, ov: !!o && o !== auto, cls:[] };
    });
    return { p:p, idx:idx, folgaW:folgaW, cells:cells, hours:[], folgas:0 };
  });
  /* dia fechado: todos de folga (ex.: feriado em que o restaurante fecha) */
  var shut = days.map(function(d, j){ return d.wd !== 1 && rows.length > 0 && rows.every(function(r){ return r.cells[j].v === "F"; }); });
  var alerts = [], cover = {}, offG = [], offC = [];
  var funcs = []; rows.forEach(function(r){ if (funcs.indexOf(r.p.funcao) < 0) funcs.push(r.p.funcao); });
  funcs.sort(function(a,b){ return idxF(a) - idxF(b); });
  funcs.forEach(function(f){ cover[f] = days.map(function(){ return 0; }); });
  days.forEach(function(d, j){
    var g = [], c = [];
    rows.forEach(function(r){
      var cell = r.cells[j];
      if (cell.v === "T") cover[r.p.funcao][j]++;
      if (cell.v === "F" && d.wd !== 1 && !shut[j]){ if (r.p.funcao === "Garçom") g.push(r); if (r.p.funcao === "Cumim") c.push(r); }
      if (d.wd === 1) cell.cls.push("mon");
      else if (shut[j]) cell.cls.push("shut");
      if (cell.v === "F" && (d.wd === 6 || d.wd === 7)){ cell.cls.push("bad"); alerts.push({ t:"red", s:3, n:d.n, txt:"<b>" + esc(r.p.nome) + "</b> de folga no " + DIAS_LONGO[d.dn].toLowerCase() + " " + ddmm(d.n) + ". Sábado e domingo ninguém folga." }); }
      if (cell.v === "T" && d.wd === 1){ alerts.push({ t:"red", s:3, n:d.n, txt:"<b>" + esc(r.p.nome) + "</b> escalado na segunda " + ddmm(d.n) + ", dia em que o restaurante fecha." }); }
      if (cell.v === "T" && d.fer) cell.cls.push("ferT");
      if (cell.ov) cell.cls.push("ov");
    });
    offG.push(d.wd === 1 ? null : g.length); offC.push(d.wd === 1 ? null : c.length);
    if (g.length > 1){ g.forEach(function(r){ r.cells[j].cls.push("clash"); }); alerts.push({ t:"orange", s:2, n:d.n, txt: d.dn + " " + ddmm(d.n) + ": " + g.length + " garçons de folga juntos (" + g.map(function(r){ return esc(r.p.nome); }).join(", ") + ")." }); }
    if (c.length > 1){ c.forEach(function(r){ r.cells[j].cls.push("clash"); }); alerts.push({ t:"orange", s:2, n:d.n, txt: d.dn + " " + ddmm(d.n) + ": " + c.length + " cumins de folga juntos (" + c.map(function(r){ return esc(r.p.nome); }).join(", ") + ")." }); }
    if (d.fer){
      var work = rows.filter(function(r){ return r.cells[j].v === "T"; }).length;
      if (shut[j]) alerts.push({ t:"ochre", s:1, n:d.n, txt:"Feriado " + ddmm(d.n) + " (" + esc(d.fer) + "): restaurante fechado, todos de folga." });
      else if (d.wd !== 1) alerts.push({ t:"ochre", s:1, n:d.n, txt:"Feriado " + ddmm(d.n) + " (" + esc(d.fer) + "): " + work + " pessoa" + (work===1?"":"s") + " trabalhando, com pagamento em dobro ou folga compensatória." });
    }
  });
  var limite = +state.limite || 42;
  rows.forEach(function(r){
    r.hours = weeks.map(function(wk){ var t = 0; days.forEach(function(d, j){ if (d.week === wk.i && r.cells[j].v === "T") t++; }); return t * horasTurno; });
    r.folgas = r.cells.filter(function(c){ return c.v === "F"; }).length;
    r.hours.forEach(function(h, k){ if (h > limite + 1e-6) alerts.push({ t:"red", s:3, n:weeks[k].startN, txt:"<b>" + esc(r.p.nome) + "</b> com " + fmtH(h) + " na semana " + weeks[k].label + " (limite " + limite + "h)." }); });
  });
  alerts.sort(function(a,b){ return (b.s - a.s) || (a.n - b.n); });
  return { start:start, end:end, b5:b5, offset:offset, horasTurno:horasTurno, days:days, weeks:weeks, rows:rows, alerts:alerts, cover:cover, funcs:funcs, offG:offG, offC:offC, shut:shut, limite:limite };
}
function idxF(f){ var i = FUNCOES.indexOf(f); return i < 0 ? 99 : i; }

/* ---------- render ---------- */
var M;
function render(){
  if (STANDALONE && ui.editing && dirty()) saveLocal();
  M = compute(); cacheM = {};
  document.getElementById("periodo").textContent = ddmmyyyy(M.start) + " a " + ddmmyyyy(M.end) + " · Turno " + state.turno.codigo + " " + state.turno.entrada + "–" + state.turno.saida + " · segunda fechado";
  renderHeader(); renderFolgasHoje(); renderSummary(); renderTabs();
  renderEscala(); renderDia(); renderEquipe(); renderConfig(); renderSavebar();
}
function renderHeader(){
  var h = document.getElementById("hdrActions"), s = "";
  if (ui.local) s += '<span class="sub">Alterações salvas neste navegador em ' + esc(fmtDT(ui.local)) + '</span><button class="btn small" id="btnVoltarArq">Voltar ao arquivo</button>';
  if (ui.dl) s += '<button class="btn" id="btnBaixar">Baixar index.html</button>';
  if (ui.canEdit) s += '<button class="btn onband" id="btnEdit" aria-pressed="' + ui.editing + '">' + (ui.editing ? "Editando a escala" : "Editar escala") + '</button>';
  else if (ui.readOnlyMsg) s += '<span class="sub">' + esc(ui.readOnlyMsg) + '</span>';
  h.innerHTML = s;
}
function fmtDT(iso){ try { return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"}); } catch(e){ return iso; } }
/* período (mesmo dia inicial da escala salva) que contém uma data qualquer */
function periodoDe(iso){
  var dia0 = +state.inicio.split("-")[2], p = iso.split("-"), y = +p[0], m = +p[1], d = +p[2];
  if (d < dia0){ m -= 1; if (m < 1){ m = 12; y -= 1; } }
  var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return y + "-" + pad(m) + "-" + pad(Math.min(dia0, last));
}
var cacheM = {};
function folgasDoDia(iso){
  var ini = periodoDe(iso), mm = ini === state.inicio ? M : (cacheM[ini] || (cacheM[ini] = compute(ini)));
  var j = -1; for (var k = 0; k < mm.days.length; k++) if (mm.days[k].iso === iso){ j = k; break; }
  if (j < 0) return null;
  var d = mm.days[j];
  return { d:d, iso:iso, fora: ini !== state.inicio, mon: d.wd === 1, shut: mm.shut[j], total: mm.rows.length,
    off: mm.rows.filter(function(r){ return r.cells[j].v === "F"; }).map(function(r){ var c = r.cells[j].cls; return { nome:r.p.nome, funcao:r.p.funcao, alerta: c.indexOf("bad") >= 0 || c.indexOf("clash") >= 0, troca: c.indexOf("ov") >= 0 }; }) };
}
function blocoFolga(info, rotulo){
  var d = info.d, tit = '<div class="fh-day"><span class="k">' + rotulo + '</span><b>' + DIAS_LONGO[d.dn] + ', ' + ddmm(d.n) + '</b>' + (d.fer ? '<span class="fh-fer">Feriado: ' + esc(d.fer) + '</span>' : '') + '</div>';
  if (info.mon) return tit + '<p class="fh-msg">Restaurante fechado. Folga de toda a equipe.</p>';
  if (info.shut) return tit + '<p class="fh-msg">Restaurante fechado. Toda a equipe de folga.</p>';
  if (!info.off.length) return tit + '<p class="fh-msg">Ninguém de folga. Equipe completa: ' + info.total + ' pessoas no turno.</p>';
  info.off.sort(function(a,b){ return idxF(a.funcao) - idxF(b.funcao); });
  var dup = {}; info.off.forEach(function(o){ if (o.funcao === "Garçom" || o.funcao === "Cumim") dup[o.funcao] = (dup[o.funcao]||0) + 1; });
  var avis = Object.keys(dup).filter(function(f){ return dup[f] > 1; }).map(function(f){ return dup[f] + ' ' + (f === "Garçom" ? "garçons" : "cumins") + ' de folga juntos'; });
  return tit + '<p class="fh-msg"><b>' + info.off.length + ' de folga</b>, ' + (info.total - info.off.length) + ' no turno ' + esc(state.turno.codigo) + ' (' + state.turno.entrada + '–' + state.turno.saida + ').' + (avis.length ? ' <span class="fh-warn">Atenção: ' + avis.join(" e ") + '.</span>' : '') + '</p>' +
    '<ul class="fh-list">' + info.off.map(function(o){ return '<li class="' + (o.alerta ? "warn" : "") + '"><b>' + esc(o.nome) + '</b><span>' + esc(o.funcao) + (o.troca ? " · troca" : "") + '</span></li>'; }).join("") + '</ul>';
}
function renderFolgasHoje(){
  var el = document.getElementById("folgasHoje"); if (!el) return;
  var td = hoje(), amanha = toISO(toN(td) + 1);
  var a = folgasDoDia(td), b = folgasDoDia(amanha);
  if (!a){ el.hidden = true; return; }
  var nota = (a.fora || (b && b.fora)) ? '<p class="fh-note">Este dia fica fora da escala salva (' + ddmm(M.start) + ' a ' + ddmm(M.end) + '). As folgas foram calculadas pelo rodízio da equipe atual.</p>' : '';
  el.hidden = false;
  el.innerHTML = '<div class="fh-head"><span class="fh-badge">Folgas de hoje</span>' + nota + '</div><div class="fh-cols"><div class="fh-col today">' + blocoFolga(a, "Hoje") + '</div>' + (b ? '<div class="fh-col">' + blocoFolga(b, "Amanhã") + '</div>' : '') + '</div>';
}
function renderSummary(){
  var red = M.alerts.filter(function(a){ return a.t === "red"; }).length, orange = M.alerts.filter(function(a){ return a.t === "orange"; }).length;
  var fh = folgasDoDia(hoje()), j = fh ? 0 : -1, working = "–";
  if (fh) working = fh.mon || fh.shut ? "Fechado" : (fh.total - fh.off.length) + ' <small>de ' + fh.total + ' · ' + fh.off.length + ' de folga</small>';
  var ferList = M.days.filter(function(d){ return d.fer; });
  document.getElementById("summary").innerHTML =
    '<div><div class="k">Período</div><div class="v">' + ddmm(M.start) + ' <small>a</small> ' + ddmm(M.end) + '</div></div>' +
    '<div><div class="k">Equipe</div><div class="v">' + M.rows.length + ' <small>colaboradores · ' + M.weeks.length + ' semanas</small></div></div>' +
    '<div><div class="k">Trabalhando hoje</div><div class="v">' + (j >= 0 ? working : '<small>hoje está fora do período</small>') + '</div></div>' +
    '<div><div class="k">Alertas</div><div class="v ' + (red ? "alert" : (orange ? "" : "good")) + '">' + (red + orange === 0 ? "Nenhum" : red + orange + ' <small>' + red + ' graves · ' + orange + ' de cobertura</small>') + '</div></div>' +
    '<div><div class="k">Feriados no período</div><div class="v">' + ferList.length + ' <small>' + ferList.map(function(d){ return ddmm(d.n); }).join(", ") + '</small></div></div>';
}
function renderTabs(){
  ["escala","dia","equipe","config"].forEach(function(t){
    document.getElementById("tab-"+t).setAttribute("aria-selected", ui.tab === t ? "true" : "false");
    document.getElementById("view-"+t).hidden = ui.tab !== t;
  });
}
function indexDia(iso){ for (var j = 0; j < M.days.length; j++) if (M.days[j].iso === iso) return j; return -1; }

  var v = document.getElementById("view-escala"), td = hoje();

  var h = '';
  if (ui.editing) h += '<div class="editnote">Toque numa célula para trocar entre <b>' + esc(state.turno.codigo) + '</b> e <b>F</b> (atestado, troca entre colegas). O ponto no canto marca uma troca manual; tocar de novo volta ao rodízio. ' + (STANDALONE ? 'Cada alteração é salva automaticamente neste navegador. Para atualizar o site para todos, use <b>Baixar index.html</b> e envie o arquivo para o repositório.' : 'As alterações só valem depois de <b>Salvar escala</b>.') + '</div>';
  h += '<div class="toolbar"><label for="filtroFn">Função <select id="filtroFn">' + opts + '</select></label>' +
       '<div class="legend"><span><i class="sw" style="background:var(--surface)"></i>' + esc(state.turno.codigo) + ' trabalha</span><span><i class="sw" style="background:var(--anil-soft)"></i>F folga</span>' +
       '<span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--closed) 0 4px,var(--hatch) 4px 6px)"></i>Segunda fechado</span>' +
       '<span><i class="sw" style="background:var(--ochre-soft)"></i>Feriado</span><span><i class="sw" style="background:var(--red-soft);border-color:var(--red)"></i>Folga proibida</span>' +
       '<span><i class="sw" style="background:var(--orange-soft);border-color:var(--orange)"></i>Folga coincidente</span></div></div>';
  h += '<div class="cols"><div class="gridbox"><table class="grid' + (ui.editing ? " editing" : "") + '"><thead><tr><th class="nm" rowspan="2">Colaborador</th><th class="fn" rowspan="2">Função</th>';
  M.weeks.forEach(function(wk){ var span = M.days.filter(function(d){ return d.week === wk.i; }).length; if (span) h += '<th class="wkh wk" colspan="' + span + '">S' + wk.i + ' · ' + wk.label + '</th>'; });
  h += '<th class="hh wk" colspan="' + (M.weeks.length + 1) + '" style="text-align:left">Horas por semana</th></tr><tr>';
  M.days.forEach(function(d, j){ var wkc = (j === 0 || d.wd === 2) ? " wk" : ""; h += '<th class="d' + wkc + (d.fer ? " fer" : "") + (d.iso === td ? " today" : "") + '" title="' + esc(d.fer ? d.fer : DIAS_LONGO[d.dn] + " " + ddmm(d.n)) + '"><span class="dw">' + (d.fer ? "Fer" : d.dn) + '</span><span class="dn">' + new Date(d.n*864e5).getUTCDate() + '</span></th>'; });
  M.weeks.forEach(function(wk, k){ h += '<th class="hh' + (k === 0 ? " wk" : "") + '">S' + wk.i + '</th>'; });
  h += '<th class="hh">Folgas</th></tr></thead><tbody>';
  var lastF = null;
  rows.forEach(function(r){
    if (!ui.filtro && r.p.funcao !== lastF){ lastF = r.p.funcao; }
    h += '<tr><td class="nm" title="' + esc(r.p.nome) + '">' + esc(r.p.nome) + '</td><td class="fn">' + esc(r.p.funcao) + '</td>';
    r.cells.forEach(function(c, j){ var d = M.days[j]; var wkc = (j === 0 || d.wd === 2) ? " wk" : "";
      var label = c.v === "T" ? state.turno.codigo : "F";
      h += '<td class="c ' + c.v + ' ' + c.cls.join(" ") + wkc + '" data-p="' + esc(r.p.id) + '" data-d="' + d.iso + '"' + (ui.editing && d.wd !== 1 ? ' tabindex="0" role="button" aria-label="' + esc(r.p.nome + " " + ddmm(d.n) + " " + label) + '"' : "") + '>' + label + '</td>'; });
    r.hours.forEach(function(x, k){ h += '<td class="h' + (k === 0 ? " wk" : "") + (x > M.limite + 1e-6 ? " over" : "") + (x === 0 ? " zero" : "") + '">' + fmtH(x) + '</td>'; });
    h += '<td class="h">' + r.folgas + '</td></tr>';
  });
  h += '</tbody><tfoot>';
  M.funcs.forEach(function(f){
    if (ui.filtro && ui.filtro !== f) return;
    h += '<tr><td class="nm">' + esc(f) + '</td><td class="fn">trabalhando</td>';
    M.cover[f].forEach(function(x, j){ var d = M.days[j]; var wkc = (j === 0 || d.wd === 2) ? " wk" : ""; var closed = d.wd === 1 || M.shut[j]; h += '<td class="' + wkc + (!closed && x === 0 ? " low" : "") + '">' + (closed ? "" : x) + '</td>'; });
    h += '<td colspan="' + (M.weeks.length + 1) + '"></td></tr>';
  });
  [["Garçom","Garçons de folga", M.offG],["Cumim","Cumins de folga", M.offC]].forEach(function(x){
    if (M.funcs.indexOf(x[0]) < 0 || (ui.filtro && ui.filtro !== x[0])) return;
    h += '<tr><td class="nm">' + x[1] + '</td><td class="fn">máx. 1</td>';
    x[2].forEach(function(n, j){ var d = M.days[j]; var wkc = (j === 0 || d.wd === 2) ? " wk" : ""; h += '<td class="' + wkc + (n > 1 ? " warn" : "") + '">' + (n == null || M.shut[j] ? "" : n) + '</td>'; });
    h += '<td colspan="' + (M.weeks.length + 1) + '"></td></tr>';
  });
  h += '</tfoot></table></div>';
  h += '<aside class="panel"><h2>Alertas da escala</h2>';

  else h += '<ul class="alerts">' + M.alerts.map(function(a){ return '<li class="' + a.t + '"><span>' + a.txt + '</span></li>'; }).join("") + '</ul>';
  h += '<div class="rules"><p><b>5x2:</b> segunda é folga fixa (restaurante fechado) e cada um tem mais 1 folga entre terça e sexta, em rodízio.</p>' +

       '<p><b>Atenção legal:</b> 8h24 por dia só vale com acordo ou convenção coletiva durante a transição. Confirme com o contador.</p></div></aside></div>';
  v.innerHTML = h;
}

function renderDia(){
  var v = document.getElementById("view-dia");
  if (ui.dia === null || indexDia(ui.dia) < 0){ var td = hoje(); ui.dia = indexDia(td) >= 0 ? td : M.days[0].iso; }
  var j = indexDia(ui.dia), d = M.days[j];
  var opts = M.days.map(function(x){ return '<option value="' + x.iso + '"' + (x.iso === ui.dia ? " selected" : "") + '>' + x.dn + ' ' + ddmm(x.n) + (x.fer ? " · feriado" : "") + '</option>'; }).join("");
  var h = '<div class="daynav"><button class="btn small" id="diaPrev" ' + (j <= 0 ? "disabled" : "") + ' aria-label="Dia anterior">←</button>' +
          '<span class="daytitle">' + DIAS_LONGO[d.dn] + ', ' + ddmm(d.n) + '</span>' +
          '<button class="btn small" id="diaNext" ' + (j >= M.days.length-1 ? "disabled" : "") + ' aria-label="Próximo dia">→</button>' +
          '<label for="diaSel" class="muted" style="display:flex;gap:6px;align-items:center">Ir para <select id="diaSel">' + opts + '</select></label>' +
          (d.iso !== hoje() && indexDia(hoje()) >= 0 ? '<button class="btn small ghost" id="diaHoje">Hoje</button>' : "") + '</div>';
  if (d.fer) h += '<div class="ferbanner"><b>Feriado: ' + esc(d.fer) + '.</b> Quem trabalhar recebe em dobro ou folga compensatória.</div>';
  if (d.wd === 1) h += '<div class="closedmsg">Segunda-feira: restaurante fechado. Folga de toda a equipe.</div>';
  else if (M.shut[j]) h += '<div class="closedmsg">Restaurante fechado neste dia. Toda a equipe de folga.</div>';
  else {
    h += '<div class="roles">';
    M.funcs.forEach(function(f){
      var rs = M.rows.filter(function(r){ return r.p.funcao === f; });
      var on = rs.filter(function(r){ return r.cells[j].v === "T"; }), off = rs.filter(function(r){ return r.cells[j].v === "F"; });
      h += '<div class="role"><h3>' + esc(f) + '<span>' + on.length + '/' + rs.length + ' no turno</span></h3><ul>';
      on.forEach(function(r){ h += '<li><span>' + esc(r.p.nome) + '</span><span class="pill">' + esc(state.turno.codigo) + ' ' + state.turno.entrada + '–' + state.turno.saida + '</span></li>'; });
      off.forEach(function(r){ var bad = r.cells[j].cls.indexOf("bad") >= 0 || r.cells[j].cls.indexOf("clash") >= 0; h += '<li><span class="muted">' + esc(r.p.nome) + '</span><span class="pill F' + (bad ? " bad" : "") + '">folga</span></li>'; });
      h += '</ul></div>';
    });
    h += '</div>';
  }
  v.innerHTML = h;
}

function renderEquipe(){
  var v = document.getElementById("view-equipe"), ed = ui.editing;
  var h = '';
  h += '<p class="hint" style="margin:0 0 12px">A segunda folga de cada semana vem do rodízio Ter → Qua → Qui → Sex, que continua de um mês para o outro. ' + (ed ? 'Escolha outro dia para trocar; a caixa fica azul quando foge do rodízio. "Rodízio" devolve ao dia sugerido.' : 'Dias em azul fogem do rodízio sugerido.') + '</p>';
  h += '<div class="gridbox"><table class="list"><thead><tr><th>Nº</th><th>Nome</th><th>Função</th><th>Turno</th>';
  M.weeks.forEach(function(wk){ h += '<th>Folga S' + wk.i + '<br><small>' + wk.label + '</small></th>'; });
  h += '<th>Horas no mês</th>' + (ed ? '<th></th>' : '') + '</tr></thead><tbody>';
  var byId = {}; M.rows.forEach(function(r){ byId[r.p.id] = r; });
  state.equipe.forEach(function(p){
    var r = byId[p.id];
    h += '<tr><td class="muted">' + (r ? r.idx + 1 : "–") + '</td>';
    if (ed){
      h += '<td><input type="text" id="nome-' + esc(p.id) + '" data-act="nome" data-p="' + esc(p.id) + '" value="' + esc(p.nome) + '" placeholder="Nome" aria-label="Nome"></td>';
      h += '<td><select id="fn-' + esc(p.id) + '" data-act="funcao" data-p="' + esc(p.id) + '" aria-label="Função">' + FUNCOES.concat(FUNCOES.indexOf(p.funcao) < 0 ? [p.funcao] : []).map(function(f){ return '<option' + (f === p.funcao ? " selected" : "") + '>' + esc(f) + '</option>'; }).join("") + '</select></td>';
    } else {
      h += '<td>' + esc(p.nome) + '</td><td>' + esc(p.funcao) + '</td>';
    }
    h += '<td class="muted">' + esc(state.turno.codigo) + '</td>';
    M.weeks.forEach(function(wk, k){
      if (!r){ h += '<td></td>'; return; }
      var fw = r.folgaW[k];
      if (ed){
        h += '<td><select id="fg-' + esc(p.id) + '-' + wk.i + '" class="' + (fw.ov && fw.val !== fw.auto ? "ovr" : "") + '" data-act="folga" data-p="' + esc(p.id) + '" data-w="' + wk.iso + '" aria-label="Folga semana ' + wk.i + '">' +
             '<option value="">Rodízio (' + fw.auto + ')</option>' + ROT.map(function(x){ return '<option value="' + x + '"' + (fw.ov && fw.val === x ? " selected" : "") + '>' + x + '</option>'; }).join("") + '</select></td>';
      } else {
        h += '<td>' + (fw.ov && fw.val !== fw.auto ? '<span class="pill F">' + fw.val + '</span>' : fw.val) + '</td>';
      }
    });
    h += '<td>' + (r ? fmtH(r.hours.reduce(function(a,b){ return a+b; }, 0)) : "") + '</td>';
    if (ed) h += '<td><button class="btn small ghost" data-act="remover" data-p="' + esc(p.id) + '">Remover</button></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if (ed) h += '<div style="margin-top:12px"><button class="btn" id="btnAdd">Adicionar colaborador</button></div>';
  v.innerHTML = h;
}

function renderConfig(){
  var v = document.getElementById("view-config"), ed = ui.editing;
  var nTrocas = Object.keys(state.trocas).filter(function(k){ var iso = k.split("|")[1]; var n = toN(iso); return n >= M.start && n <= M.end; }).length;
  var h = '<div class="stack"><div class="panel"><h2>Mês da escala</h2><div class="formgrid">';
  h += '<div class="field"><label for="cfgInicio">Data inicial</label>' + (ed ? '<input type="date" id="cfgInicio" value="' + state.inicio + '">' : '<span class="ro">' + ddmmyyyy(M.start) + '</span>') + '<p class="hint">Troque todo mês (ex.: 16/01/2027). O fim, as semanas e o rodízio se ajustam sozinhos.</p></div>';
  h += '<div class="field"><label>Data final</label><span class="ro">' + ddmmyyyy(M.end) + '</span><p class="hint">Um mês depois, menos 1 dia.</p></div>';
  h += '<div class="field"><label>Início da 1ª semana</label><span class="ro">' + ddmmyyyy(M.b5) + ' (terça)</span><p class="hint">Semanas vão de terça a segunda.</p></div>';
  h += '<div class="field"><label for="cfgLimite">Limite semanal (h)</label>' + (ed ? '<input type="number" id="cfgLimite" min="1" max="60" step="1" value="' + esc(state.limite) + '">' : '<span class="ro">' + esc(state.limite) + 'h</span>') + '<p class="hint">42h até 15/12/2027; 40h depois.</p></div>';
  h += '</div>';
  if (ed) h += '<div class="toolbar" style="margin:14px 0 0"><button class="btn" id="mesAnt">← Mês anterior</button><button class="btn" id="mesProx">Próximo mês →</button>' +
               '<button class="btn" id="limparTrocas"' + (nTrocas ? "" : " disabled") + '>Limpar trocas manuais (' + nTrocas + ')</button></div><p class="hint">Ao passar para o próximo mês, as trocas manuais do mês anterior ficam guardadas nas datas delas e não aparecem no novo mês.</p>';
  h += '</div>';
  h += '<div class="panel"><h2>Turno</h2><div class="formgrid">';
  h += '<div class="field"><label>Código</label><span class="ro">' + esc(state.turno.codigo) + ' · ' + esc(state.turno.descricao) + '</span></div>';
  [["entrada","Entrada"],["saida","Saída"]].forEach(function(x){ h += '<div class="field"><label for="cfg-' + x[0] + '">' + x[1] + '</label>' + (ed ? '<input type="time" id="cfg-' + x[0] + '" data-turno="' + x[0] + '" value="' + esc(state.turno[x[0]]) + '">' : '<span class="ro">' + esc(state.turno[x[0]]) + '</span>') + '</div>'; });
  h += '<div class="field"><label for="cfg-intervalo">Intervalo (h)</label>' + (ed ? '<input type="number" id="cfg-intervalo" data-turno="intervalo" min="0" max="3" step="0.25" value="' + esc(state.turno.intervalo) + '">' : '<span class="ro">' + esc(state.turno.intervalo) + 'h</span>') + '</div>';
  h += '<div class="field"><label>Horas trabalhadas por dia</label><span class="ro">' + fmtH(M.horasTurno) + '</span><p class="hint">' + fmtH(M.horasTurno) + ' × 5 dias = ' + fmtH(M.horasTurno*5) + ' por semana.</p></div>';
  h += '</div></div>';
  h += '<div class="panel"><h2>Feriados (Recife/PE)</h2><p class="hint" style="margin:0 0 10px">Aparecem em destaque na escala. Quem trabalhar recebe em dobro ou folga compensatória. Se todos estiverem de folga no dia, a escala trata como restaurante fechado.</p><table class="list"><thead><tr><th>Data</th><th>Dia</th><th>Feriado</th>' + (ed ? '<th></th>' : '') + '</tr></thead><tbody>';
  state.feriados.forEach(function(f, i){
    var n = f.data ? toN(f.data) : null, inP = n !== null && n >= M.start && n <= M.end;
    h += '<tr' + (inP ? ' style="background:var(--ochre-soft)"' : '') + '>';
    if (ed) h += '<td><input type="date" id="fer-d-' + i + '" data-fer="' + i + '" data-k="data" value="' + esc(f.data) + '"></td><td class="muted">' + (n !== null ? DIAS[wd(n)] : "") + '</td><td><input type="text" id="fer-n-' + i + '" data-fer="' + i + '" data-k="nome" value="' + esc(f.nome) + '" style="width:240px"></td><td><button class="btn small ghost" data-ferdel="' + i + '">Remover</button></td>';
    else h += '<td>' + (n !== null ? ddmmyyyy(n) : "") + '</td><td class="muted">' + (n !== null ? DIAS[wd(n)] : "") + '</td><td>' + esc(f.nome) + '</td>';
    h += '</tr>';
  });
  h += '</tbody></table>' + (ed ? '<div style="margin-top:10px"><button class="btn" id="ferAdd">Adicionar feriado</button></div>' : '') + '</div></div>';
  v.innerHTML = h;
}

function dirty(){ return JSON.stringify(state) !== BASELINE; }
function renderSavebar(){
  var b = document.getElementById("savebar");
  if (!ui.editing){ b.hidden = true; document.body.style.paddingBottom = ""; return; }
  var dd = dirty();
  b.hidden = false; document.body.style.paddingBottom = "64px";
  if (STANDALONE){
    b.innerHTML = '<div class="wrap"><span>' + (ui.saveFail ? "Este navegador não deixou salvar. Use Baixar index.html para não perder as alterações." : (ui.local ? "Alterações salvas automaticamente neste navegador às " + esc(fmtHora(ui.local)) + "." : "Cada alteração é salva automaticamente neste navegador.")) + '</span>' +
      '<span style="display:flex;gap:8px"><button class="btn primary" id="btnSair">Concluir edição</button></span></div>';
    return;
  }
  b.innerHTML = '<div class="wrap"><span>' + (ui.saving ? "Salvando…" : (dd ? "Há alterações não salvas." : "Nenhuma alteração.")) + '</span><span style="display:flex;gap:8px">' +
    '<button class="btn" id="btnDesc"' + (dd && !ui.saving ? "" : " disabled") + '>Descartar</button>' +
    '<button class="btn" id="btnSair"' + (ui.saving ? " disabled" : "") + '>' + (dd ? "Continuar depois" : "Sair da edição") + '</button>' +
    '<button class="btn primary" id="btnSave"' + (dd && !ui.saving ? "" : " disabled") + '>' + (STANDALONE ? "Salvar neste navegador" : "Salvar escala") + '</button></span></div>';
}
var toastT;
function toast(msg){ var t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 3800); }

/* ---------- ações ---------- */
function person(id){ for (var i = 0; i < state.equipe.length; i++) if (state.equipe[i].id === id) return state.equipe[i]; return null; }
function toggleCell(pid, iso){
  var r = M.rows.filter(function(x){ return x.p.id === pid; })[0]; if (!r) return;
  var j = indexDia(iso); if (j < 0 || M.days[j].wd === 1) return;
  var c = r.cells[j], next = c.v === "T" ? "F" : "T", key = pid + "|" + iso;
  if (next === c.auto) delete state.trocas[key]; else state.trocas[key] = next;
  render();
  var el = document.querySelector('td.c[data-p="' + pid + '"][data-d="' + iso + '"]'); if (el) el.focus();
}
document.addEventListener("click", function(e){
  var t = e.target.closest("button, td.c"); if (!t) return;
  if (t.classList.contains("tab")){ ui.tab = t.dataset.tab; try { sessionStorage.setItem("tp-tab", ui.tab); } catch(x){} renderTabs(); return; }
  if (t.matches("td.c")){ if (ui.editing) toggleCell(t.dataset.p, t.dataset.d); return; }
  switch (t.id){
    case "btnEdit": ui.editing = !ui.editing; render(); return;
    case "btnDesc": state = JSON.parse(BASELINE); render(); toast("Alterações descartadas."); return;
    case "btnBaixar": baixar(); return;
    case "btnVoltarArq":
      if (t.dataset.confirm === "1"){ try { localStorage.removeItem(LS_KEY); } catch(x){} state = JSON.parse(ORIGINAL); BASELINE = JSON.stringify(state); ui.local = null; ui.dia = null; render(); toast("Alterações locais apagadas. Mostrando a escala do arquivo."); }
      else { t.dataset.confirm = "1"; t.textContent = "Confirmar: apagar alterações locais"; }
      return;
    case "btnSair": ui.editing = false; render(); return;
    case "btnSave": salvar(); return;
    case "diaPrev": ui.dia = M.days[Math.max(0, indexDia(ui.dia)-1)].iso; renderDia(); return;
    case "diaNext": ui.dia = M.days[Math.min(M.days.length-1, indexDia(ui.dia)+1)].iso; renderDia(); return;
    case "diaHoje": ui.dia = hoje(); renderDia(); return;
    case "btnAdd": state.equipe.push({ id:"p" + Date.now().toString(36), nome:"", funcao:"Garçom", folgas:{} }); render(); var ins = document.querySelectorAll('#view-equipe input[data-act="nome"]'); if (ins.length) ins[ins.length-1].focus(); return;
    case "mesAnt": case "mesProx": state.inicio = toISO(edate(state.inicio, t.id === "mesProx" ? 1 : -1)); ui.dia = null; render(); toast("Escala de " + ddmmyyyy(M.start) + " a " + ddmmyyyy(M.end) + ". Salve para valer."); return;
    case "limparTrocas": Object.keys(state.trocas).forEach(function(k){ var n = toN(k.split("|")[1]); if (n >= M.start && n <= M.end) delete state.trocas[k]; }); render(); toast("Trocas manuais do período removidas."); return;
    case "ferAdd": state.feriados.push({ data:"", nome:"" }); render(); return;
  }
  if (t.dataset.act === "remover"){
    var p = person(t.dataset.p);
    if (t.dataset.confirm === "1"){ state.equipe = state.equipe.filter(function(x){ return x.id !== t.dataset.p; }); Object.keys(state.trocas).forEach(function(k){ if (k.indexOf(t.dataset.p + "|") === 0) delete state.trocas[k]; }); render(); toast((p && p.nome ? p.nome : "Colaborador") + " removido da equipe."); }
    else { t.dataset.confirm = "1"; t.textContent = "Confirmar"; t.classList.remove("ghost"); }
    return;
  }
  if (t.dataset.ferdel !== undefined){ state.feriados.splice(+t.dataset.ferdel, 1); render(); }
});
document.addEventListener("keydown", function(e){
  var t = e.target; if (!(t.matches && t.matches("td.c")) || !ui.editing) return;
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleCell(t.dataset.p, t.dataset.d); }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "filtroFn"){ ui.filtro = t.value; try { localStorage.setItem("tp-filtro", ui.filtro); } catch(x){} renderEscala(); return; }
  if (t.id === "diaSel"){ ui.dia = t.value; renderDia(); return; }
  if (!ui.editing) return;
  if (t.id === "cfgInicio" && t.value){ state.inicio = t.value; ui.dia = null; render(); return; }
  if (t.id === "cfgLimite"){ state.limite = +t.value || 42; render(); return; }
  if (t.dataset.turno){ state.turno[t.dataset.turno] = t.dataset.turno === "intervalo" ? (+t.value || 0) : t.value; render(); return; }
  if (t.dataset.fer !== undefined){ state.feriados[+t.dataset.fer][t.dataset.k] = t.value; render(); return; }
  var p = t.dataset.p && person(t.dataset.p); if (!p) return;
  if (t.dataset.act === "nome"){ p.nome = t.value.trim(); render(); }
  else if (t.dataset.act === "funcao"){ p.funcao = t.value; render(); }
  else if (t.dataset.act === "folga"){ p.folgas = p.folgas || {}; if (t.value) p.folgas[t.dataset.w] = t.value; else delete p.folgas[t.dataset.w]; render(); }
});
window.addEventListener("beforeunload", function(e){ if (ui.editing && dirty() && !ui.saving){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- salvar: republica a página com o novo estado ---------- */
var artifactNS = null;
function buildDoc(){
  var st = Object.assign({}, state, { atualizado: new Date().toISOString() });
  var json = JSON.stringify(st).replace(/</g, "\\u003c");
  var parts = SNAP.slice(0, -1).join("") + '<script type="application/json" id="estado">' + json + '<\/script>' + SNAP[SNAP.length-1];
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' + parts + '</body></html>';
}
var downloadsNS = null;
function baixar(){
  var doc = buildDoc();
  if (STANDALONE){
    try {
      var url = URL.createObjectURL(new Blob([doc], { type:"text/html" })), a = document.createElement("a");
      a.href = url; a.download = "index.html"; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
      toast("index.html baixado. Envie para o repositório do GitHub para atualizar o site.");
    } catch(e){ toast("Este navegador não deixou baixar o arquivo."); }
    return;
  }
  if (!downloadsNS){ toast("Baixar não está disponível nesta visualização."); return; }
  downloadsNS.save({ filename:"index.html", data:doc }).then(function(){ toast("index.html pronto. Envie para o repositório do GitHub para atualizar o site."); }, function(err){
    var c = err && err.code; if (c === "declined") return;
    toast(c === "rate_limited" ? "Já tem um download esperando confirmação." : "Não foi possível baixar o arquivo aqui.");
  });
}
function fmtHora(iso){ try { return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"America/Sao_Paulo"}); } catch(e){ return ""; } }
function saveLocal(){
  var now = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify({ estado:state, base: JSON.parse(ORIGINAL).atualizado || null, salvoEm:now })); }
  catch(e){ ui.saveFail = true; return false; }
  ui.saveFail = false; BASELINE = JSON.stringify(state); ui.local = now; return true;
}
function salvar(){
  if (STANDALONE){
    var now = new Date().toISOString();
    try { localStorage.setItem(LS_KEY, JSON.stringify({ estado:state, base: JSON.parse(ORIGINAL).atualizado || null, salvoEm:now })); }
    catch(e){ toast("Este navegador não deixou salvar. Use Baixar index.html para guardar as alterações."); return; }
    BASELINE = JSON.stringify(state); ui.local = now; render();
    toast("Salvo neste navegador. Para atualizar o GitHub, use Baixar index.html.");
    return;
  }
  if (!artifactNS){ toast("Não foi possível salvar nesta visualização."); return; }
  var probs = state.equipe.filter(function(p){ return !(p.nome||"").trim(); }).length;
  ui.saving = true; renderSavebar();
  try { sessionStorage.setItem("tp-tab", ui.tab); sessionStorage.setItem("tp-saved", "1"); } catch(x){}
  artifactNS.publish(buildDoc()).then(function(){ /* a página recarrega com a nova versão */ }, function(err){
    ui.saving = false;
    try { sessionStorage.removeItem("tp-saved"); } catch(x){}
    var code = err && err.code;
    if (code === "conflict"){ toast("Outra pessoa salvou a escala antes. Recarregando a versão mais nova."); return; }
    if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "not_declared"){
      ui.canEdit = false; ui.editing = false; ui.readOnlyMsg = "Somente leitura"; render(); toast("Você pode ver a escala, mas não tem permissão para alterá-la."); return; }
    if (code === "rate_limited"){ renderSavebar(); toast("Muitos salvamentos seguidos. Aguarde um pouco e tente de novo."); return; }
    if (code === "too_large"){ renderSavebar(); toast("A escala ficou grande demais para salvar. Limpe trocas antigas na Configuração."); return; }
    renderSavebar(); toast("Não salvou por uma falha do serviço. Tente de novo em instantes.");
  });
  if (probs) { /* linhas sem nome são ignoradas na escala, igual à planilha */ }
}

render();
try { if (sessionStorage.getItem("tp-saved") === "1"){ sessionStorage.removeItem("tp-saved"); toast("Escala salva."); } } catch(x){}

if (!STANDALONE){
  window.claude.use("downloads").then(function(d){ downloadsNS = d; ui.dl = !!d; renderHeader(); }, function(){});
  Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function(res){
    artifactNS = res[0]; var user = res[1];
    if (!artifactNS) return;
    var p = (user && typeof user.canEdit === "function") ? Promise.resolve(user.canEdit()).catch(function(){ return true; }) : Promise.resolve(true);
    return p.then(function(can){
      ui.canEdit = can !== false; if (!ui.canEdit) ui.readOnlyMsg = "Somente leitura";
      renderHeader();
    });
  }, function(){});
}
})();
</script>
